/* ใบปิดผิว (ทีละใบ) */
function prdLmHtml(oid, docs, r, o) {
  if (!docs.length && o && o.none && +o.none.lm > 0) return prdNoneCard('งานปิดผิว', o.none.lm);   /* V1.8.4 */
  if (!docs.length) return '<div class="card">' + empty('file', 'ยังไม่มีใบปิดผิวของงานนี้', 'แผนกด “📤 ส่งเฉพาะใบปิดผิว เข้า App ไลน์ผลิต” ในแท็บเอกสารใบปิดผิวของ Production (หรือกล่อง “📤 ส่งเอกสารเข้า App ไลน์ผลิต”) แล้วใบจะขึ้นที่นี่') + '</div>';
  const live = docs.filter((d) => !d.cancelled && !d.gone && !d.removedAt), dead = docs.filter((d) => (d.cancelled || d.gone) && !d.removedAt), rmd = docs.filter((d) => d.removedAt), adm = r === 'admin';
  const bulk = '';
  const card = (d) => {
    const h = d.head || {}, off = d.cancelled || d.gone || d.removedAt, tot = d.lines.reduce((n, l) => n + (+l.qty || 0), 0), a = d.adm || {};
    const b9 = prdBrief(oid) || {}, ldu = prdLmDue(Object.assign({}, d, { oid }), !!a.due), lin = (b9.pdue || {}).show ? (b9.install || '') : '';   /* V1.7.3: กำหนดเสร็จตาม 📅 · วันติดตั้งออกเมื่อ Production เปิด “แสดงวันติดตั้งในเอกสาร” (ไม่มี End Date) */
    const edited = !off && d.st !== 'sent' && d.gotAt && d.at && new Date(d.at) > new Date(d.gotAt);
    const acts = off ? '' : prdProg('lm', d.id, d.st, prdCntK(d)) + prdHoldBanner(Object.values(prdHoldMap(PRD.det[oid], 'lm', d.id)));   /* V1.8.0 */
    const ab = adm ? '<span class="prd-admb">' + (d.removedAt ? '<button class="btn sm" data-act="prdAdmRestore" data-kind="lm" data-oid="' + esc(oid) + '" data-ref="' + esc(d.id) + '">' + icon('undo', 'sm') + ' กู้คืนใบนี้</button>'
      : '<button class="btn sm ghost" data-act="prdAdmEdit" data-kind="lm" data-oid="' + esc(oid) + '" data-ref="' + esc(d.id) + '" title="Admin แก้ (เฉพาะ CN)">' + icon('edit', 'sm') + ' แก้</button>' +
        (a.due || a.note ? '<button class="btn sm ghost" data-act="prdAdmClear" data-kind="lm" data-oid="' + esc(oid) + '" data-ref="' + esc(d.id) + '" title="คืนค่าจาก Production">' + icon('refresh', 'sm') + '</button>' : '') +
        '<button class="btn sm ghost prd-del" data-act="prdAdmDel" data-kind="lm" data-oid="' + esc(oid) + '" data-ref="' + esc(d.id) + '" title="Admin ลบใบนี้ (ซ่อนจากทุกคน)">' + icon('trash', 'sm') + ' ลบ</button>') + '</span>' : '';
    return '<div class="card prd-doc' + (off ? ' off' : d.st === 'done' ? ' ok' : '') + '"><div class="card-h"><h2><span class="mono">' + esc(d.no) + '</span> ' +
        (d.removedAt ? '<span class="badge t-red">Admin ลบแล้ว (ซ่อนจากทุกคน)</span>' : off ? '<span class="badge t-gray">' + (d.gone ? 'ไม่อยู่ในรอบที่แผนส่งล่าสุด' : 'ยกเลิกแล้ว') + '</span>' : prdBadge('lm', d.st)) +
        (edited ? ' <span class="badge t-red">แผนแก้ใบหลังรับงาน ' + fmtDT(d.at) + '</span>' : '') + (+d.orders > 1 ? ' <span class="badge t-violet">รวม ' + d.orders + ' Order</span>' : '') + (a.due || a.note ? ' ' + prdAdmTag() : '') + '</h2>' +
        '<span class="small muted">ออกใบ ' + prdD(d.issuedAt) + ab + '</span></div><div class="card-b">' + (d.removedAt ? '<div class="small muted" style="margin-bottom:8px">ลบโดย ' + esc(d.removedBy || 'Admin') + ' ' + fmtDT(d.removedAt) + '</div>' : '') +

      '<div class="prd-lmh">' + (ldu ? '<div class="prd-due' + (d.st !== 'done' && prdLate(ldu) ? ' late' : '') + '"><span>วันกำหนดเสร็จ (ปิดผิว)</span><b>' + prdIso(ldu) + '</b>' + (lin ? '<span class="xs">วันติดตั้ง ' + prdIso(lin) + '</span>' : '') +
          (a.due ? '<span class="xs">Admin แก้ · เดิม ' + ((d.headOrig || {}).due ? prdIso(d.headOrig.due) : '—') + '</span>' : '') + '</div>' : '') +
        '<dl class="prd-dl">' + ((o && o.lot) || h.lot ? '<dt>LOT</dt><dd class="mono">' + esc((o && o.lot) || h.lot) + '</dd>' : '') + (h.prodPool ? '<dt>Prod Pool</dt><dd>' + esc(h.prodPool) + '</dd>' : '') + (h.pdPool ? '<dt>PD Pool</dt><dd>' + esc(h.pdPool) + '</dd>' : '') +
        (h.note ? '<dt>หมายเหตุ</dt><dd>' + esc(h.note) + '</dd>' : '') + (a.note ? '<dt>หมายเหตุ (Admin)</dt><dd class="prd-anote2">' + esc(a.note) + prdAdmWho(a) + '</dd>' : '') + '</dl></div>' +
      '<div class="table-wrap"><table class="t resp prd-lines"><thead><tr><th>รหัสไม้</th><th>รายละเอียด</th><th class="r">จำนวน</th></tr></thead><tbody>' +
        d.lines.map((l) => '<tr><td class="main mono strong">' + esc(l.code) + '</td><td data-l="รายละเอียด"><div>' + esc(l.name || '') +
            (l.bom && l.bom.length ? '<details class="prd-bom"><summary>แตก BOM ' + l.bom.length + ' รายการ</summary><ul>' + l.bom.map((x) => '<li><span class="mono">' + esc(x.code) + '</span> ' + esc(x.name || '') + ' — <b>' + prdQty(x.qty) + '</b> ' + esc(x.unit || '') + '</li>').join('') + '</ul></details>' : '') + '</div></td>' +
          '<td data-l="จำนวน" class="r"><span><b>' + prdQty(l.qty) + '</b> ' + esc(l.unit || 'แผ่น') + '</span></td></tr>').join('') +
        '<tr class="prd-tot"><td colspan="2">รวม ' + d.lines.length + ' รายการ<span class="prd-tot-m"> · <b>' + prdQty(tot) + '</b> แผ่น</span></td><td class="r prd-tot-n"><span><b>' + prdQty(tot) + '</b> แผ่น</span></td></tr>' +
      '</tbody></table></div>' + (acts ? '<div style="margin-top:12px">' + acts + '</div>' : '') + '</div></div>';
  };
  return prdSent(o.lmAt, o.lmBy) + bulk + live.map(card).join('') + (dead.length ? '<details class="prd-dead"><summary>ใบที่ยกเลิก / ไม่อยู่ในรอบล่าสุด ' + dead.length + ' ใบ</summary>' + dead.map(card).join('') + '</details>' : '') +
    (rmd.length ? '<details class="prd-dead prd-rmd"><summary>' + icon('trash', 'sm') + ' ใบที่ Admin ลบ (ซ่อนจากทุกคน) ' + rmd.length + ' ใบ</summary>' + rmd.map(card).join('') + '</details>' : '');
}

/* ใบสั่งตัด (สถานะงานตัด + ไม้ในใบ + ชิ้นที่ทำสี → พิมพ์ใบส่งทำสีได้) */
function prdNoCut() { return '<div class="card">' + empty('layers', 'ยังไม่มีงานสีของงานนี้', 'แผนกด “📤 ส่งเฉพาะงานสี เข้า App ไลน์ผลิต” (Production แท็บ 🧪 สารเคมี) หรือกล่อง “📤 ส่งเอกสารเข้า App ไลน์ผลิต” บนแถบชื่อ Order') + '</div>'; }
function prdEditedAfter(D, k) { const x = (D.stages || {})[k] || {}; return x.gotAt && D.order.cutChgAt && new Date(D.order.cutChgAt) > new Date(x.gotAt) ? ' <span class="badge t-red">แผนส่งงานใหม่หลังรับงาน ' + fmtDT(D.order.cutChgAt) + '</span>' : ''; }
function prdCutAdm(oid, D) {   /* V7.17.2 Admin: ลบ / กู้คืนใบสั่งตัด (+ งานสี) */
  const o = D.order; if (S.user.role !== 'admin' || !o.cutAt) return '';
  if (o.cutRemovedAt) return prdRmNote(o.cutRemovedAt, o.cutRemovedBy, 'cut', oid, '', (D.cut && D.cut.paintOnly ? 'งานสี ' : 'ใบสั่งตัดไม้ (+ งานสี) '));
  return '<div class="prd-admrow"><button class="btn sm ghost prd-del" data-act="prdAdmDel" data-kind="cut" data-oid="' + esc(oid) + '" title="Admin ลบ (ซ่อนจากทุกคน)">' + icon('trash', 'sm') + ' ' + (D.cut && D.cut.paintOnly ? 'ลบงานสี' : 'ลบใบสั่งตัดไม้ (+ งานสี)') + '</button></div>';
}
function prdCutHtml(oid, D) {
  const c = D.cut, o = D.order; if ((!o.cutAt || !c) && o.none && +o.none.paint > 0) return prdNoneCard('งานสี', o.none.paint);   /* V1.8.4 */
  if (!o.cutAt || !c) return prdNoCut();
  const M = Array.isArray(c.mats) ? c.mats : [], C = Array.isArray(c.colors) ? c.colors : [];
  const x = Object.assign({ sentAt: o.cutAt }, (D.stages || {}).cut || {});
  return prdCutAdm(oid, D) + prdSent(o.cutAt, o.cutBy) + prdStageCard('cut', oid, x, prdEditedAfter(D, 'cut'), Object.values(prdHoldMap(D, 'cut', ''))) +
    (C.length ? '<div class="card prd-paint"><div class="card-b prd-paintbar"><div><b>มีชิ้นต้องทำสี ' + prdQty(c.pcs) + ' ชิ้น · ' + C.length + ' สี · ' + prdM2(c.total) + ' ตร.ม.</b><div class="small muted">ตัดเสร็จแล้วส่งชิ้นเหล่านี้ไปแผนกทำสี พร้อมใบส่งทำสี</div></div>' +
      '<div class="prd-acts" style="margin:0"><button class="btn primary" data-act="prdPaintPrint" data-oid="' + esc(oid) + '">' + icon('print', 'sm') + ' พิมพ์ใบส่งทำสี</button><button class="btn sm" data-act="prdTab" data-oid="' + esc(oid) + '" data-t="paint">ดูใบส่งทำสี ' + icon('chevRight', 'xs') + '</button></div></div></div>'
      : '<div class="card"><div class="card-b">' + notice('info', 'ใบสั่งตัดนี้ไม่มีงานสี — ไม่มีชิ้นที่หน้าบน / ล่างเป็นรหัสสี N00S') + '</div></div>') +
    '<div class="card prd-sec"><div class="card-h"><h2>' + icon('layers') + ' ไม้ในใบสั่งตัด <span class="muted small">' + M.length + ' รหัส · ' + prdQty(c.all) + ' ชิ้น</span></h2></div>' +
      '<div class="table-wrap"><table class="t resp prd-lines"><thead><tr><th>รหัสไม้ (CutRite)</th><th class="r">แถว</th><th class="r">ชิ้น</th><th class="r">ทำสี (ชิ้น)</th></tr></thead><tbody>' +
      M.map((m) => '<tr><td class="main mono">' + esc(m.code) + '</td><td data-l="แถว" class="r">' + prdQty(m.rows) + '</td><td data-l="ชิ้น" class="r"><b>' + prdQty(m.pcs) + '</b></td><td data-l="ทำสี" class="r">' + (+m.paint ? '<b class="prd-pc">' + prdQty(m.paint) + '</b>' : '—') + '</td></tr>').join('') +
      '</tbody></table></div><div class="card-b xs muted">ผังตัด / ขนาดชิ้นทั้งหมด ดูที่ใบสั่งตัด .SAW / CNC ที่พิมพ์จาก Production</div></div>';
}

/* ใบส่งทำสี (คัดเฉพาะชิ้นที่มี N00S · ฟอร์มเดียวกับในใบสั่งตัดของ Production) */
function prdPaintData(D) {
  const c = D.cut || {}, o = D.order;
  const b = prdBrief(o.oid) || {}, P = o.due || b.pdue || {};   /* V1.5: กำหนดจบงานสี · วันติดตั้งออกเฉพาะเมื่อ Production เปิด “แสดงวันติดตั้งในเอกสาร” */
  return { job: o.oid, title: o.title, iid: o.iid, lot: o.lot || '', ref: c.paintOnly ? 'งานสีจากแผน' : 'ใบสั่งตัด + งานสี จากแผน', sentAt: o.cutAt, sentBy: o.cutBy, colors: c.colors || [], parts: c.parts || [], more: c.more || 0,
    due: prdDueOf(Object.assign({}, b, { pdue: P }), 'paint'), install: b.install || '', showInstall: !!P.show };
}
on('prdPaintPrint', (el) => { const D = PRD.det[el.dataset.oid]; if (!D) return; if (!PAINTDOC_open(prdPaintData(D))) toast('เปิดแท็บใหม่ไม่ได้ — อนุญาตป๊อปอัปของเว็บนี้ก่อน', 'err'); });
function prdPaintHtml(oid, D) {
  const c = D.cut, o = D.order; if ((!o.cutAt || !c) && o.none && +o.none.paint > 0) return prdNoneCard('งานสี', o.none.paint);   /* V1.8.4 */
  if (!o.cutAt || !c) return prdNoCut();
  const C = Array.isArray(c.colors) ? c.colors : [], P = Array.isArray(c.parts) ? c.parts : [];
  if (!C.length) return prdCutAdm(oid, D) + prdSent(o.cutAt, o.cutBy) + '<div class="card"><div class="card-b">' + notice('info', 'งานสีที่แผนส่งล่าสุดของงานนี้ไม่มีชิ้นทำสี — ไม่มีชิ้นที่หน้าบน / ล่างเป็นรหัสสี N00S') + '</div></div>';
  const x = Object.assign({ sentAt: o.cutAt }, (D.stages || {}).paint || {});
  const cf = PRD.cf[oid] || '', PL = cf ? P.filter((p) => p.top === cf || p.bot === cf) : P;
  const face = (v) => v ? '<span class="prd-cc">' + prdSw(v) + '<span class="mono">' + esc(v) + '</span></span>' : '<span class="muted">—</span>';
  const side = (p) => p.top && p.bot ? (p.top === p.bot ? '2 หน้า' : 'บน / ล่าง ต่างสี') : p.top ? 'หน้าบน' : 'หน้าล่าง';
  return prdCutAdm(oid, D) + prdSent(o.cutAt, o.cutBy, c.paintOnly ? 'แผนส่งงานสี' : 'แผนส่งใบสั่งตัดไม้ + งานสี (เดิม)') + prdStageCard('paint', oid, x, prdEditedAfter(D, 'paint'), Object.values(prdHoldMap(D, 'paint', ''))) +
    '<div class="card prd-paint"><div class="card-h"><h2><span>ใบส่งทำสี ' + (prdPnoOk(o.pno) ? prdIdl(prdPnoOk(o.pno)) + ' ' : '') + '— ' + prdQty(c.pcs) + ' ชิ้น · ' + C.length + ' สี · รวม <span class="prd-big">' + prdM2(c.total) + '</span> ตร.ม.</span></h2>' +
      '<button class="btn primary" data-act="prdPaintPrint" data-oid="' + esc(oid) + '">' + icon('print', 'sm') + ' พิมพ์ใบส่งทำสี</button></div><div class="card-b">' +
      '<div class="table-wrap"><table class="t resp prd-lines"><thead><tr><th>รหัสสี</th><th>ชื่อสี</th><th class="r">ชิ้น</th><th class="r">ตร.ม.</th><th>สเปกไม้</th></tr></thead><tbody>' +
        C.map((y) => '<tr><td class="main">' + face(y.code) + '</td><td data-l="ชื่อสี">' + esc(y.short || '') + (y.name ? ' <span class="small muted">' + esc(y.name) + '</span>' : '') + '</td>' +
          '<td data-l="ชิ้น" class="r">' + prdQty(y.pcs) + '</td><td data-l="ตร.ม." class="r"><b>' + prdM2(y.m2) + '</b></td>' +
          '<td data-l="สเปกไม้" class="small">' + (y.specs || []).map((s) => '<div><span class="mono">' + esc(s.spec) + '</span>' + (s.name ? ' ' + esc(s.name) : '') + ' — ' + prdM2(s.m2) + ' ตร.ม. · ' + prdQty(s.pcs) + ' ชิ้น</div>').join('') + '</td></tr>').join('') +
      '</tbody></table></div><div class="xs muted" style="margin-top:8px">ตร.ม. = กว้าง × ยาว ต่อหน้าที่มีรหัสสี N00S (1 ช่อง = 1 หน้า · 2 ช่อง = 2 หน้า) + ขอบ หนา × กว้าง × 2 + หนา × ยาว × 2 (ขอบนับไปสีหน้าบน) × จำนวนชิ้น</div></div></div>' +
    '<div class="card prd-sec"><div class="card-h"><h2>ชิ้นที่ทำสี <span class="muted small">' + PL.length + (cf ? ' / ' + P.length : '') + ' แถว</span></h2>' +
      (C.length > 1 ? '<div class="chips">' + [['', 'ทุกสี']].concat(C.map((y) => [y.code, y.code + (y.short ? ' ' + y.short : '')])).map((y) => '<button class="fchip ' + (cf === y[0] ? 'on' : '') + '" data-act="prdCf" data-oid="' + esc(oid) + '" data-c="' + esc(y[0]) + '">' + esc(y[1]) + '</button>').join('') + '</div>' : '') + '</div>' +
    '<div class="table-wrap"><table class="t resp prd-lines prd-cut-t"><thead><tr><th>ชิ้นส่วน</th><th>Part ID</th><th>ตู้</th><th>Barcode</th><th class="r">กว้าง × ยาว × หนา</th><th class="r">จำนวน</th><th>หน้าบน</th><th>หน้าล่าง</th><th>ด้าน</th><th class="r">ตร.ม.</th></tr></thead><tbody>' +
      PL.map((p) => '<tr><td class="main">' + esc(p.name || '—') + '</td><td data-l="Part ID" class="small mono">' + esc(p.pid || '—') + '</td><td data-l="ตู้" class="small mono">' + esc(p.cab || '—') + '</td><td data-l="Barcode" class="small mono">' + esc(p.bc || '—') + '</td>' +
        '<td data-l="ขนาด" class="r small">' + prdQty(p.w) + ' × ' + prdQty(p.l) + ' × ' + prdQty(p.t) + '</td><td data-l="จำนวน" class="r"><b>' + prdQty(p.q) + '</b></td>' +
        '<td data-l="หน้าบน">' + face(p.top) + '</td><td data-l="หน้าล่าง">' + face(p.bot) + '</td><td data-l="ด้าน" class="small">' + side(p) + '</td><td data-l="ตร.ม." class="r">' + prdM2(p.m2) + '</td></tr>').join('') +
    '</tbody></table></div>' + (+c.more ? '<div class="card-b xs muted">+ อีก ' + prdQty(c.more) + ' แถวชิ้นที่ทำสี ไม่ได้ส่งมา (เกิน 1,500 แถว) — ดูที่ใบสั่งตัดใน Production</div>' : '') + '</div>';
}
on('prdCf', (el) => { PRD.cf[el.dataset.oid] = el.dataset.c; rerender(); });

/* ใบรายการสั่งทำ = สถานีงานสั่งทำ (แผนก Support) — รายการ + สถานะทีละรายการ · ติ๊กที่หน้าติ๊กสถานะ · Admin แก้ / ลบ / กู้คืน */

    '<button class="btn sm primary" data-act="spnGuideOk">เข้าใจแล้ว</button></div>' + spnGuideSteps() + '</div></div>';
}
on('spnGuideOk', () => { try { localStorage.setItem(SPN_GUIDE_K, '1'); } catch (e) { /* ไม่มีที่เก็บ */ } SPN_GUIDE_HIDE.on = true; rerender(); });
const SPN_GUIDE_HIDE = { on: false };
on('spnGuide', () => modal({ title: icon('info') + ' วิธีใช้ Starmark PSN', sub: 'ติ๊กสถานะงานไลน์ผลิต 3 ขั้น', body: spnGuideSteps(), foot: '<button class="btn primary" data-act="closeOv">เข้าใจแล้ว</button>' }));

})();

</script>
