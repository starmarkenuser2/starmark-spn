<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#14233B">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starmark PSN · แผนผลิต · ไลน์ผลิต</title>
<meta name="description" content="Contractor Nexus ระบบบริหารงานติดตั้งเฟอร์นิเจอร์และผู้รับเหมา — Admin, Sale, จัดซื้อ, ผู้รับเหมา">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Contractor Nexus — V7
   Tokens: ink (โครงหลัก) · paper (พื้นหลัง) · brass (เมนูที่เลือก/วัสดุ) · action (ปุ่มหลัก) · สีสถานะ */
:root{
  --ink:#14233B; --ink-2:#1C3150; --ink-3:#2A4468; --ink-text:#16202E;
  --paper:#F2F4F7; --surface:#FFFFFF; --surface-2:#F7F9FB; --line:#DFE4EA; --line-2:#C9D1DB;
  --text-2:#4A5568; --text-3:#7A8594;
  --brass:#B8862F; --brass-bg:#FBF3E2;
  --action:#1E5BA8; --action-2:#174B8C; --action-bg:#E8F0FB;
  --blue:#1E5BA8; --blue-bg:#E8F0FB;
  --amber:#9A6206; --amber-bg:#FDF1DA;
  --teal:#0E7466; --teal-bg:#DDF3EF;
  --violet:#6A4BC4; --violet-bg:#EFEAFB;
  --orange:#C25A0F; --orange-bg:#FDEBDD;
  --green:#237A4B; --green-bg:#E3F3E9;
  --red:#BE3A31; --red-bg:#FBE7E5;
  --gray:#5F6B7A; --gray-bg:#EDF0F4;
  --r-lg:14px; --r:10px; --r-sm:8px;
  --shadow:0 1px 2px rgba(20,35,59,.06),0 6px 18px rgba(20,35,59,.05);
  --font:'IBM Plex Sans Thai','Sarabun','Noto Sans Thai','Leelawadee UI','Tahoma',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.55;color:var(--ink-text);background:#E6E9EE}
h1,h2,h3,h4{margin:0;line-height:1.3;color:var(--ink)}
h1{font-size:23px;font-weight:700} h2{font-size:17px;font-weight:600} h3{font-size:15.5px;font-weight:600} h4{font-size:14.5px;font-weight:600}
p{margin:0 0 .6em}
a{color:var(--action);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ico.sm{width:15px;height:15px;vertical-align:-2px}.ico.xs{width:13px;height:13px;vertical-align:-2px}.ico.lg{width:26px;height:26px}
:focus-visible{outline:2px solid var(--action);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-3)}.small{font-size:13.5px}.xs{font-size:12.5px}.strong{font-weight:600}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
.hidden{display:none!important}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.spacer{flex:1}

/* ---------- พื้นที่แอป (ความกว้างแอปใช้ตัดสินเลย์เอาต์มือถือ) ---------- */
#app{container-type:inline-size;container-name:app;min-height:100vh;background:var(--paper)}

/* ---------- โครงแอป ---------- */
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh;position:relative;background:linear-gradient(to right,var(--ink) 244px,var(--paper) 244px)}
.side{background:var(--ink);color:#C5D0DF;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .brand{display:flex;gap:10px;align-items:center;padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.side .brand .bm{width:34px;height:34px;border-radius:9px;background:var(--ink-3);display:flex;align-items:center;justify-content:center}
.side .brand b{display:block;color:#fff;font-size:15px;line-height:1.2}.side .brand span{font-size:12px;color:#93A3BA}
.side .who{margin:12px 12px 4px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.05);display:flex;gap:10px;align-items:center}
.side .who .av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px;flex:none}
.side .who .nm{color:#fff;font-size:13.5px;font-weight:600;line-height:1.25}
.nav{padding:8px 10px;flex:1}
.nav .sec{font-size:12px;color:#7F90A8;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:#C5D0DF;font-size:14.5px;margin:1px 0;text-decoration:none}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:var(--ink-3);color:#fff;box-shadow:inset 3px 0 0 var(--brass)}
.nav a .cnt{margin-left:auto;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;font-size:11.5px;padding:0 7px;line-height:19px}
.nav a .cnt.warn{background:#C98A1B}
.side .foot{padding:12px 16px;font-size:12px;color:#7F90A8;border-top:1px solid rgba(255,255,255,.07)}
.side .foot button{background:none;border:0;color:#AFC0DA;cursor:pointer;padding:0;display:flex;gap:6px;align-items:center;font-size:13px}
.app-main{min-width:0;display:flex;flex-direction:column}
.mtop{display:none;align-items:center;gap:10px;padding:10px 14px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:20}
.mtop button{background:none;border:0;color:#fff;padding:4px;cursor:pointer}
.mtop b{font-size:15px}
.content{padding:22px 26px 40px;max-width:1320px;width:100%}
.viewas{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 26px;background:var(--brass-bg);border-bottom:1px solid #EBD9B0;font-size:13.5px;color:#6B4E15}
.viewas b{color:#4B360B}.viewas select{border:1px solid #D9C08A;border-radius:7px;padding:3px 8px;background:#fff}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-head .sub{color:var(--text-2);font-size:14px;margin-top:4px;max-width:760px}
.crumb{font-size:13px;color:var(--text-3);margin-bottom:4px}

/* ---------- ส่วนประกอบ ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:#fff;color:var(--ink-text);font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2);text-decoration:none}
.btn.primary{background:var(--action);border-color:var(--action);color:#fff}.btn.primary:hover{background:var(--action-2)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{background:#fff;border-color:#E4B4AF;color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--action)}
.btn.sm{height:32px;padding:0 11px;font-size:13.5px}.btn.xs{height:27px;padding:0 9px;font-size:12.5px;gap:5px}
.btn.lg{height:46px;font-size:15.5px;padding:0 18px}.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.grid > .card,.grid > .card + .card{margin-top:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{display:flex;gap:8px;align-items:center}
.card-b{padding:16px 18px}
.card-f{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.badge{display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.badge.plain::before{display:none}
.t-blue{background:var(--blue-bg);color:var(--blue)}.t-amber{background:var(--amber-bg);color:var(--amber)}.t-teal{background:var(--teal-bg);color:var(--teal)}
.t-violet{background:var(--violet-bg);color:var(--violet)}.t-orange{background:var(--orange-bg);color:var(--orange)}.t-green{background:var(--green-bg);color:var(--green)}
.t-red{background:var(--red-bg);color:var(--red)}.t-gray{background:var(--gray-bg);color:var(--gray)}
.t-brass{background:var(--brass-bg);color:#8A6420}
.role{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap;flex:none}
.r-admin{background:var(--ink)}.r-sale{background:var(--blue)}.r-purchasing{background:var(--teal)}.r-contractor{background:var(--orange)}
.r-accounting{background:#8A6420}.r-installer{background:var(--violet)}.r-warehouse{background:#2F5D7C}
.notice{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:var(--r);font-size:14px;border:1px solid}
.notice .ico{margin-top:2px}
.n-info{background:var(--blue-bg);border-color:#C3D5EF;color:#1E3F6D}.n-warn{background:var(--amber-bg);border-color:#EDD3A0;color:#6B4505}
.n-danger{background:var(--red-bg);border-color:#EDBDB8;color:#7C2620}.n-ok{background:var(--green-bg);border-color:#BADFC8;color:#1B5A37}
.n-secret{background:#FFF7F6;border-color:#EDC4BF;color:#7C2620}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:12.5px;font-weight:600;color:var(--text-3);padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.t td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:#F8FAFD}
.t .r{text-align:right}.t .c{text-align:center}
.t .sub{font-size:12.5px;color:var(--text-3)}
.t tr.blocked td{background:#FFFAF9}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:inherit}
.kpi:hover{text-decoration:none}
.kpi .k{font-size:13px;color:var(--text-2);display:flex;gap:6px;align-items:center}
.kpi .v{font-size:28px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.25}
.kpi .s{font-size:12.5px;color:var(--text-3)}
.kpi.accent{border-top:3px solid var(--k,var(--action))}
.dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 16px;margin:0;font-size:14px}
.dl dt{color:var(--text-3)}.dl dd{margin:0;min-width:0}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > label{font-size:13.5px;font-weight:600;color:var(--text-2)}
.field .req{color:var(--red)}
.input,.select,.textarea{width:100%;border:1px solid var(--line-2);border-radius:var(--r-sm);background:#fff;padding:8px 11px;font-size:14.5px;min-height:40px}
.textarea{min-height:80px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--action);box-shadow:0 0 0 3px rgba(30,91,168,.14)}
.addon{display:flex}.addon .input{border-radius:var(--r-sm) 0 0 var(--r-sm)}.addon span{display:flex;align-items:center;padding:0 11px;border:1px solid var(--line-2);border-left:0;border-radius:0 var(--r-sm) var(--r-sm) 0;background:var(--surface-2);color:var(--text-2);font-size:13.5px;white-space:nowrap}
.help{font-size:12.5px;color:var(--text-3)}
.field.invalid .input,.field.invalid .select,.field.invalid .textarea{border-color:var(--red)}
.field .err{font-size:12.5px;color:var(--red);display:none}.field.invalid .err{display:block}
.form-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px 16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
.c2{grid-column:span 2}   /* V7.13 */
.check{display:inline-flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:14px}
.check input{width:17px;height:17px;margin-top:3px;accent-color:var(--action)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 13px;cursor:pointer;font-size:13.5px;color:var(--text-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--text-2)}
.fchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fchip .n{opacity:.7;margin-left:3px}
.empty{padding:34px 18px;text-align:center;color:var(--text-3)}
.empty .ico{width:34px;height:34px;color:var(--line-2);margin-bottom:8px}
.empty h3{color:var(--text-2);margin-bottom:4px}
.divider{height:1px;background:var(--line);margin:16px 0}
.sec-t{display:flex;align-items:center;gap:8px;margin:22px 0 10px;font-weight:600;font-size:16px;color:var(--ink)}
.sec-t .n{background:var(--ink);color:#fff;border-radius:999px;font-size:12px;padding:0 8px;line-height:20px}
.money{font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- วัสดุ: ประเภทงาน (HG / Membrane / เมลามีน) ---------- */
.sw{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;padding:2px 9px 2px 3px;border-radius:999px;background:#F1F3F6;border:1px solid var(--line);white-space:nowrap}
.sw i{width:18px;height:18px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.mat-HG{background:linear-gradient(128deg,#1D2A3D 0%,#33476A 38%,#E9EFF7 47%,#7D93B3 52%,#2B3E5E 62%,#1A2639 100%)}
.mat-Membrane{background:radial-gradient(ellipse at 30% 22%,#FFFFFF 0%,#EFEBE4 40%,#DCD5C9 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1),inset 0 -3px 6px rgba(80,60,30,.12)}
.mat-Melamine{background:repeating-linear-gradient(97deg,#C99F6C 0 2px,#B88A57 2px 4px,#D6B386 4px 9px,#BF9361 9px 11px,#CFA978 11px 15px)}
.mat-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mat-tile{position:relative;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;overflow:hidden;display:flex;flex-direction:column}
.mat-tile .face{height:78px;position:relative}
.mat-tile .face .chk{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;color:var(--action);opacity:0;transition:opacity .15s}
.mat-tile .lbl{padding:9px 12px 10px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mat-tile .lbl b{font-size:15.5px}.mat-tile .lbl span{font-size:12.5px;color:var(--text-3)}
.mat-tile input{position:absolute;opacity:0;pointer-events:none}
.mat-tile.on{border-color:var(--action);box-shadow:0 0 0 3px rgba(30,91,168,.14)}
.mat-tile.on .chk{opacity:1}
.mat-tile:focus-within{outline:2px solid var(--action);outline-offset:2px}
.type-rows{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.type-row{display:grid;grid-template-columns:150px minmax(0,1fr) 180px;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.type-row .fee{text-align:right}
.type-row .fee b{display:block;font-size:16px;color:var(--teal)}
.fee-total{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--teal-bg);color:#0B5A50;flex-wrap:wrap}
.fee-total b{font-size:21px}

/* ---------- นับถอยหลัง ---------- */
.cd{display:inline-flex;flex-direction:column;gap:4px;min-width:170px}
.cd .cd-t{display:flex;gap:6px;align-items:center;font-size:13.5px;font-weight:600;color:var(--blue);font-variant-numeric:tabular-nums;white-space:nowrap}
.cd .cd-bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.cd .cd-bar i{display:block;height:100%;background:var(--blue);border-radius:4px}
.cd.soon .cd-t{color:var(--orange)}.cd.soon .cd-bar i{background:var(--orange)}
.cd.over .cd-t{color:var(--red)}.cd.over .cd-bar i{background:var(--red)}
.cd .cd-s{font-size:11.5px;color:var(--text-3)}

/* ---------- การ์ดงานผู้รับเหมา (ตามภาพตัวอย่างที่ 1) ---------- */
.job-feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.job{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.job .jh{display:flex;justify-content:space-between;gap:12px;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.job .jid{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;font-size:14px;color:var(--ink)}
.job .jmeta{font-size:12.5px;color:var(--text-3);margin-top:3px}
.job .ref{flex:none;text-align:right;background:var(--green-bg);border:1px solid #BADFC8;border-radius:10px;padding:6px 10px;align-self:flex-start}
.job .ref .k{font-size:12px;color:var(--green);display:flex;gap:4px;align-items:center;justify-content:flex-end}
.job .ref .v{font-size:18px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;white-space:nowrap}
.job .ref .s{font-size:11.5px;color:var(--green);opacity:.85}
.job .jb{padding:12px 16px;flex:1}
.job .jb h3{margin-bottom:6px;font-size:16px}
.job .ln{display:flex;gap:7px;align-items:flex-start;font-size:13.5px;color:var(--text-2);margin:3px 0}
.job .ln .ico{margin-top:2px;color:var(--text-3)}
.job .draw{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.job .jf{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.job.expired{opacity:.72}
.drawbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--action);cursor:pointer}
.drawbtn:hover{background:var(--action-bg)}
.drawbtn.prod{color:var(--teal)}.drawbtn.prod:hover{background:var(--teal-bg)}

/* ---------- ผู้รับเหมา: แถบแท็บล่าง (มือถือ) ---------- */
.ctabs{display:none}
.con-hero{background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:16px 18px;margin-bottom:16px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
.con-hero h1{color:#fff;font-size:19px}.con-hero .s{color:#AFC0DA;font-size:13px}
.con-hero .stats{display:flex;gap:18px}
.con-hero .stats div,.con-hero .stats a{text-align:center}.con-hero .stats b{display:block;font-size:20px;color:#fff}.con-hero .stats span{font-size:12px;color:#AFC0DA}
.con-hero .stats a{text-decoration:none;padding:4px 10px;border-radius:10px;border:1px solid transparent}
.con-hero .stats a:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
.con-hero .stats a.on{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25)}
.con-hero .stats a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ---------- ขั้นตอนติดตั้ง (Tab 3) ---------- */
.steps{display:flex;flex-direction:column;gap:0;margin-top:6px}
.stp{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.stp:not(:last-child)::before{content:'';position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.stp .dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line-2);background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--text-3)}
.stp.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.stp.cur .dot{border-color:var(--action);color:var(--action);box-shadow:0 0 0 4px rgba(30,91,168,.12)}
.stp.done:not(:last-child)::before{background:var(--green)}
.stp .sb{padding-top:5px}
.stp .sb h4{margin-bottom:4px}
.stp .box{margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.barcode-ph{display:flex;gap:12px;align-items:center}
.barcode-ph .bc{width:74px;height:46px;border-radius:6px;background:repeating-linear-gradient(90deg,#14233B 0 2px,transparent 2px 4px,#14233B 4px 5px,transparent 5px 8px,#14233B 8px 11px,transparent 11px 12px);opacity:.75;flex:none}
.prog{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:8px}
.upl{display:block;border:2px dashed var(--line-2);border-radius:10px;padding:16px;text-align:center;color:var(--text-3);cursor:pointer;background:#fff}
.upl:hover{border-color:var(--action);color:var(--action)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{width:88px;height:66px;border-radius:8px;border:1px solid var(--line);background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-3);cursor:pointer;position:relative}
.thumb img,.thumb svg{width:100%;height:100%;object-fit:cover}

/* ---------- การเงิน (Tab 4) ---------- */
.pay-hero{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:14px}
.pay-hero .pv{padding:18px;border-radius:var(--r-lg);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.pay-hero .pv .k{font-size:13.5px;color:var(--text-2)}
.pay-hero .pv .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.2;margin-top:2px}
.pay-hero .pv.main{background:var(--ink);border-color:var(--ink)}
.pay-hero .pv.main .k{color:#AFC0DA}.pay-hero .pv.main .v{color:#fff;font-size:34px}
.pay-hero .pv.left .v{color:var(--orange)}
.pay-next{display:flex;gap:14px;align-items:center;padding:14px 18px;border-radius:var(--r-lg);background:var(--orange-bg);border:1px solid #F2C9A8;margin-top:14px;flex-wrap:wrap}
.pay-next .dd{font-size:20px;font-weight:700;color:var(--orange)}

/* ---------- ปฏิทิน / คิว ---------- */
/* ปฏิทิน Booking แบบแถบต่อเนื่อง */
.calw{border-top:1px solid var(--line);border-left:1px solid var(--line)}
.calw-h{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.calw-h .dw{padding:7px 8px;font-size:12.5px;color:var(--text-3);background:var(--surface-2);border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
.calw-h .dw.we{color:var(--red)}
.cw{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:4px;min-height:112px}
.cw .cday{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 7px;min-width:0}
.cw .cday.we{background:#FCFCFD}
.cw .cday.out{background:#F7F8FA}.cw .cday.out .dn{color:var(--line-2)}
.cw .cday.today{background:#F2F7FF}.cw .cday.today .dn{background:var(--action);color:#fff;border-radius:999px;padding:0 7px}
.cw .dn{font-size:12.5px;font-weight:600;color:var(--text-2);display:inline-block}
.cb{position:relative;z-index:1;margin:0 5px;min-width:0;display:flex;flex-direction:column;gap:1px;padding:4px 8px;border:0;border-left:3px solid var(--c);border-radius:6px;background:var(--b);color:var(--c);text-align:left;font:inherit;cursor:pointer}
.cb:hover{box-shadow:inset 0 0 0 1px var(--c)}
.cb:focus-visible{outline:2px solid var(--action);outline-offset:1px}
.cb.cl{margin-left:0;border-left-style:dotted;border-top-left-radius:0;border-bottom-left-radius:0}
.cb.cr{margin-right:0;border-top-right-radius:0;border-bottom-right-radius:0}
.cb1,.cb2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb1{font-size:12.5px;line-height:1.35}
.cb1 b{font-weight:700}
.cb1 i{font-style:normal;font-size:11px;opacity:.8;margin-left:6px}
.cb2{font-size:11.5px;line-height:1.35;color:var(--text-2)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dw{padding:7px 8px;font-size:12.5px;color:var(--text-3);background:var(--surface-2);border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
.cal .dw.we{color:var(--red)}
.cal .dc{min-height:104px;padding:5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .dc.out{background:#FAFBFC}.cal .dc.out .dn{color:var(--line-2)}
.cal .dc.today{background:#F5F9FF}.cal .dc.today .dn{background:var(--action);color:#fff;border-radius:999px;padding:0 7px}
.cal .dn{font-size:12.5px;font-weight:600;align-self:flex-start;color:var(--text-2)}
.cal .ev{display:block;font-size:11.5px;line-height:1.35;padding:2px 6px;border-radius:5px;color:var(--c);background:var(--b);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-align:left;border-top:0;border-right:0;border-bottom:0;width:100%}
.cal .ev b{font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--text-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.gantt{overflow-x:auto;border-top:1px solid var(--line);--days:28}
.gr{display:flex;min-width:max-content;width:100%;border-bottom:1px solid var(--line)}
.gr .gn{flex:0 0 220px;width:220px;padding:9px 12px;position:sticky;left:0;background:#fff;z-index:3;border-right:1px solid var(--line);font-size:13.5px}
.gr .gn b{display:block;font-size:13.5px;line-height:1.3}
.gr .gn .gs{display:block;font-size:12px;color:var(--text-3);margin-top:2px;line-height:1.35}
.gr .gn .gs.on{color:var(--violet);font-weight:600}
.gr .gt{position:relative;height:58px;flex:1 1 auto;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100% / var(--days)) 100%}
.gantt.d14 .gr .gt{min-width:calc(var(--days) * 52px)}.gantt.d28 .gr .gt{min-width:calc(var(--days) * 30px)}.gantt.d56 .gr .gt{min-width:calc(var(--days) * 17px)}
.gr.head .gt{height:40px;background-color:var(--surface-2)}
.gr.head .gn{background:var(--surface-2);font-weight:600;color:var(--text-2);font-size:12.5px}
.gr.head.gm .gt{height:26px;background-image:none;border-bottom:1px solid var(--line)}
.gr.head.gm{border-bottom:0}
.gmo{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:700;color:var(--ink-text,#1E293B);border-left:2px solid var(--line-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gd{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;line-height:1.15;color:var(--text-2);z-index:1}
.gd b{font-weight:600}
.gd i{font-style:normal;font-size:10px;color:var(--text-3)}
.gd.we b,.gd.we i{color:var(--text-3)}
.gd.now b{background:var(--red);color:#fff;border-radius:999px;padding:0 5px}
.gantt.d56 .gd i{display:none}.gantt.d56 .gd{font-size:10.5px}
.gwe{position:absolute;top:0;bottom:0;background:rgba(15,23,42,.045);pointer-events:none}
.gwant{position:absolute;top:0;bottom:0;background:rgba(37,99,235,.09);border-left:1px dashed rgba(37,99,235,.45);border-right:1px dashed rgba(37,99,235,.45);pointer-events:none}
.gnow{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--red);opacity:.55;z-index:2;pointer-events:none}
.gb{position:absolute;top:6px;height:24px;border-radius:6px;font-size:11.5px;line-height:22px;padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:1px solid;z-index:2;box-sizing:border-box}
.gb b{font-weight:700;margin-right:5px;font-variant-numeric:tabular-nums}
.gb span{font-weight:500}
.gantt.d56 .gb span{display:none}
.gb.cl{border-top-left-radius:0;border-bottom-left-radius:0;border-left-style:dashed}
.gb.cr{border-top-right-radius:0;border-bottom-right-radius:0;border-right-style:dashed}
.gb:hover{filter:brightness(.96);box-shadow:0 1px 4px rgba(15,23,42,.15)}
.gb.s-upcoming{background:var(--teal-bg);color:var(--teal);border-color:#8FCFC4}
.gb.s-installing{background:var(--violet);color:#fff;border-color:var(--violet)}
.gb.s-done{background:var(--green-bg);color:var(--green);border-color:#A9D8BC}
.gb.s-check{background:var(--orange-bg);color:var(--orange);border-color:#F0BE95}
.gb.ack{background:#FFF6E6;color:#8A5A0B;border:1px dashed #D98A16}
.gb.s-probe{background:repeating-linear-gradient(135deg,#FFF6F5,#FFF6F5 6px,#FBE1DE 6px,#FBE1DE 12px);color:var(--red);border:2px dashed var(--red);top:32px;height:22px;line-height:18px;font-weight:700;cursor:default}
.gb.s-probeok{background:repeating-linear-gradient(135deg,#F2FAF6,#F2FAF6 6px,#DDF1E6 6px,#DDF1E6 12px);color:var(--green);border:2px dashed var(--green);top:32px;height:22px;line-height:18px;font-weight:700;cursor:default}
.gr.free .gn{box-shadow:inset 3px 0 0 var(--green)}
.gr.clash .gn{box-shadow:inset 3px 0 0 var(--red)}
.gchip{margin-top:3px;line-height:1.5}
.qchip{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:1px 8px 1px 6px;border-radius:999px;vertical-align:middle}
.qchip .ico{width:12px;height:12px}
.qchip.ok{background:var(--green-bg);color:var(--green)}
.qchip.no{background:#FBE1DE;color:var(--red)}
.q-tools{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
@media (max-width:640px){.gr .gn{flex-basis:132px;width:132px;padding:8px 9px}.gr .gn b{font-size:12.5px}.gr .gn .gs{font-size:11px}.gantt.d14 .gr .gt{min-width:calc(var(--days) * 32px)}}

/* ---------- Modal / Drawer / Toast ---------- */
#overlay{position:fixed;inset:0;z-index:300;display:none;container-type:inline-size;container-name:app}
#overlay.on{display:block}
#overlay .bg{position:absolute;inset:0;background:rgba(14,22,36,.45)}
.modal{position:absolute;left:50%;top:6vh;transform:translateX(-50%);width:min(680px,calc(100% - 24px));max-height:88%;display:flex;flex-direction:column;background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.modal.lg{width:min(920px,calc(100% - 24px))}
.modal .mh,.drawer .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mh h2,.drawer .mh h2{display:flex;gap:8px;align-items:center}
.modal .mh .x,.drawer .mh .x{border:0;background:none;cursor:pointer;color:var(--text-3);padding:2px}
.modal .mb,.drawer .mb{padding:18px 20px;overflow-y:auto}
.modal .mf,.drawer .mf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 16px 16px}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(980px,100%);background:#fff;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.2);container-type:inline-size;container-name:drawer;transition:width .18s ease}
.drawer.max{width:100%}
.mh-acts{display:flex;gap:4px;align-items:center;flex:none}
.dw-h{display:none}
@container drawer (min-width:760px){
  .dw-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 28px;align-items:start}
  .dw-side{border-left:1px solid var(--line);padding-left:24px;min-height:100%}
  .dw-side > .divider:first-child{display:none}
  .dw-h{display:block;margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.drawer .mb{flex:1;min-height:0}
.drawer .mf{border-radius:0}
.drawer .mh h2{flex-wrap:wrap}
#toasts{position:fixed;right:16px;bottom:16px;z-index:400;display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:8px;align-items:center;max-width:420px}
.toast.err{background:#7C2620}.toast.ok .ico{color:#7EE2B0}
.paper-doc{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.08);padding:10px}
.paper-doc svg{display:block;width:100%;height:auto}
tr.dim td{opacity:.72}
.sn{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:1px 7px;border-radius:999px;background:#EEF3FA;color:#1E4E8C;font:600 11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;vertical-align:middle;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sn .ico{flex:none}
.jsn{display:flex;align-items:center;gap:4px;font-size:12px;color:#1E4E8C;margin-top:2px}
.sn-card{border-color:#BFD2EC;background:linear-gradient(0deg,#fff,#F5F8FD)}
.sn-card label{font-weight:700;color:var(--ink)}
.sn-in{font-size:18px;height:46px;letter-spacing:.3px}
.sn-wait{margin-top:12px;border:1.5px dashed #C9D6E8;border-radius:10px;padding:10px 12px;background:#fff}
.sn-wait-h{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--text-2)}
.sn-wait-b{margin-top:6px;font-size:12.5px;color:var(--text-3);line-height:1.9}
.sn-chip{display:inline-block;margin:0 4px 0 0;padding:0 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--text-2);font-size:12px;line-height:1.7}
.sbox{position:relative;flex:1;max-width:460px;min-width:220px}
.sbox .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.sbox .input{padding-left:34px}
tr.hidden{display:none}
.fv-links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.actbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 12px;margin-bottom:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px}
.actbar .lbl{font-size:12px;color:var(--text-3);margin-right:2px}
.refchg{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#8A5A00;background:#FFF4D6;border:1px solid #F2D58A;border-radius:999px;padding:2px 8px}
.viewer-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;color:var(--text-2);flex-wrap:wrap}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:linear-gradient(160deg,var(--ink) 0%,#223A5E 60%,#2D4B74 100%)}
.login{width:min(400px,100%);background:#fff;border-radius:18px;padding:26px 24px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.login .lg-h{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.login.setup{width:min(520px,100%)}
.lg-mark{width:44px;height:44px;border-radius:12px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.login.reg{width:min(560px,100%)}
.reg-roles{grid-template-columns:repeat(3,minmax(0,1fr))}
.lg-reg{margin-top:14px;justify-content:center}
.lg-share{display:flex;margin:12px auto 0;justify-content:center}   /* V7.16.17 */
.lg-inst:empty{display:none}   /* V7.16.18 */
.lg-inst{margin-top:14px}
.lg-inst .lg-inst-b{justify-content:center;border-color:#0e7490;color:#0e7490;font-weight:700}
.lg-inst-s{text-align:center;margin-top:6px}
.lg-inst-ok{text-align:center;color:#15803d;font-weight:700;font-size:13px;display:flex;gap:6px;align-items:center;justify-content:center}
.side .foot .f-share{margin-bottom:10px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@container app (max-width:520px){.reg-roles{grid-template-columns:1fr}}
.lg-note{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);line-height:1.5}
.login .acc{display:flex;flex-direction:column;gap:6px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.login .acc button{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 10px;cursor:pointer;font-size:13px}

/* ---------- Responsive (อิงความกว้างแอป รองรับกรอบมือถือ) ---------- */
@container app (max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@container app (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);background:var(--paper)}
  .side{display:none}
  .side.open{display:flex;position:fixed;left:0;top:0;bottom:0;width:270px;height:100vh;z-index:60;box-shadow:12px 0 40px rgba(0,0,0,.3)}
  .mtop{display:flex}
  .content{padding:16px 14px 90px}
  .viewas{padding:8px 14px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .c2,.c3,.c4,.c6,.c8,.c12{grid-column:auto}
  .mat-tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .mat-tile .face{height:58px}
  .mat-tile .lbl{flex-direction:column;gap:0;padding:7px 9px}
  .type-row{grid-template-columns:minmax(0,1fr);gap:8px}
  .type-row .fee{text-align:left}
  .job-feed{grid-template-columns:minmax(0,1fr)}
  .pay-hero{grid-template-columns:minmax(0,1fr)}
  .cw{min-height:70px}.cw .cday{padding:3px}
  .cb{margin:0 2px;padding:2px 4px}.cb1{font-size:10.5px}.cb1 i,.cb2{display:none}
  .cal .dc{min-height:64px;padding:3px}
  .cal .ev{font-size:10.5px;padding:1px 3px}
  .cal .ev .xl{display:none}
  .page-head h1{font-size:20px}
  /* ผู้รับเหมา: แท็บล่าง */
  .con .ctabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:sticky;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(20,35,59,.08);margin:0 -14px -90px;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .con .ctabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;font-size:11.5px;color:var(--text-3);text-decoration:none;position:relative;text-align:center;line-height:1.25}
  .con .ctabs a .ico,.con .ctabs .ct-menu .ico{width:22px;height:22px}
  .con .ctabs .ct-menu{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;font:inherit;font-size:11.5px;color:var(--text-3);background:none;border:0;cursor:pointer;line-height:1.25}
  .con .ctabs a.on{color:var(--action);font-weight:600}
  .con .ctabs a .cnt{position:absolute;top:0;left:calc(50% + 6px);background:var(--orange);color:#fff;border-radius:999px;font-size:10.5px;padding:0 5px;line-height:16px}
  .shell.is-con .mtop{display:none}
  .con-hero{flex-wrap:nowrap;align-items:flex-start}.con-hero>div:first-child{flex:1;min-width:0}.content.con .con-hero .pbell.ch{display:inline-flex}
  .con-hero .stats{display:none}
  .t.resp thead{display:none}
  .t.resp tr{display:block;padding:10px 12px;border-bottom:1px solid var(--line)}
  .t.resp td{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border:0;text-align:right}

/* ปุ่ม Admin อยู่ในแถวชื่อโปรแกรม → ซ่อนโลโก้ + บรรทัดรองให้ชื่อโปรแกรมไม่ล้น */
.side .brand:has(.nx-adm) .bm{display:none}
.side .brand:has(.nx-adm) > div > span{display:none}
.side .brand:has(.nx-adm) b{line-height:1.2}
/* V7.16.2: คำอธิบายเมื่อชี้ + สลิปโอนเงิน */
#tipbox{position:fixed;z-index:1000;left:0;top:0;max-width:300px;padding:8px 11px;border-radius:8px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:400;line-height:1.55;white-space:pre-line;text-align:left;box-shadow:0 8px 24px rgba(15,23,42,.28);pointer-events:none;opacity:0;visibility:hidden;transform:translateY(3px);transition:opacity .12s,transform .12s}
#tipbox.on{opacity:1;visibility:visible;transform:none}
@media (prefers-reduced-motion:reduce){#tipbox{transition:none}}
.tipq{display:inline-flex;align-items:center;gap:3px;cursor:help;text-decoration:underline dotted;text-decoration-color:var(--text-3);text-underline-offset:3px;border-radius:4px}
.tipq .ico{width:13px;height:13px;opacity:.55;flex:none}
.tipq:focus-visible{outline:2px solid var(--action);outline-offset:2px}
th .tipq{font-weight:inherit}
.thumbs.slips{margin-top:6px}
.thumbs.slips .thumb{width:64px;height:48px;cursor:pointer}
.sub.got{color:var(--green)}
.tipq.due{white-space:nowrap}
/* V7.16.3: รายการห่อทั้ง Order บนหน้างาน + ช่องยิงห่อไหนก็ได้ */
.pk-list{margin-top:12px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.pk-lh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.pk-lh b{display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
.pk-lh .pk-ok{color:var(--green)}
.pk-rows{list-style:none;margin:0;padding:0;max-height:340px;overflow:auto}
.pk-r{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:13.5px;min-height:38px}
.pk-r:last-child{border-bottom:0}
.pk-n{width:22px;flex:none;text-align:right;color:var(--text-3);font-size:12px;font-variant-numeric:tabular-nums}
.pk-c{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pk-s{font-size:12px;color:var(--text-3);white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
.pk-r.wait .pk-c{color:var(--ink-text)}
.pk-r.got{background:#F6FBF8}
.pk-r.got .pk-c{color:var(--text-2)}
.pk-r.got .pk-s{color:var(--green)}
.pk-r.new{background:#E3F5EA;box-shadow:inset 3px 0 0 var(--green);animation:pkflash 1.4s ease-out}
@keyframes pkflash{from{background:#B9E6C9}to{background:#E3F5EA}}
@media (prefers-reduced-motion:reduce){.pk-r.new{animation:none}}
@media (max-width:640px){.pk-r{flex-wrap:wrap;row-gap:2px}.pk-s{order:3;width:100%;padding-left:32px}}
.pk-find{margin-bottom:14px;border-color:#C3D5EF}
/* V7.16.4: แท็บว่าง → แสดงงานรอใส่ราคาแทน */
.con-none{display:flex;align-items:center;gap:8px;padding:10px 14px;margin-bottom:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text-2)}
/* V7.16.4: กรองรายการห่อ + รหัสที่ยังไม่ยิง + เด้งบอกยิงครบ */
.pk-fs{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px}
.pk-fs .fchip{padding:3px 10px;font-size:12.5px}
.pk-fs .fchip.warn:not(.on){border-color:#EDCB8E;background:#FFF6E6;color:#8A5A0B}
.pk-pend{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 12px 8px;color:#8A5A0B}
.pk-chip{border:1px dashed #D98A16;background:#FFF6E6;color:#8A5A0B;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:600;cursor:pointer}
.pk-chip:hover{background:#FDEBC8}
.pk-chip.more{font-family:var(--font);border-style:solid}
.pk-list .pk-rows{border-top:1px solid var(--line)}
.pk-r.pk-empty{justify-content:center;color:var(--text-3);font-size:13px}
.pk-r.go{animation:pkgo 1.6s ease-out}
@keyframes pkgo{0%{background:#FDEBC8;box-shadow:inset 3px 0 0 #D98A16}100%{background:inherit;box-shadow:none}}
@media (prefers-reduced-motion:reduce){.pk-r.go{animation:none;background:#FFF6E6}}
.pk-done{text-align:center;padding:10px 0 4px;color:var(--green)}
/* V7.16.4: ขาดส่ง — คลังส่งมาไม่ครบจำนวนตู้ (เตือน ไม่บล็อก) */
.pk-short{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:9px 11px;border:1px solid #EDD3A0;border-radius:10px;background:var(--amber-bg);color:#6B4505;font-size:13px;line-height:1.45}
.pk-short > .ico{color:var(--amber);flex:none;margin-top:2px}.pk-short .xs{margin-top:2px;color:#7A5410}
#hf > .pk-short,#ihf > .pk-short{margin:0 0 12px}
.pk-sh-t{color:var(--amber)}
.pk-find .pk-pick{margin-top:10px}.pk-find .pk-pick .select{width:100%}
/* V7.16.4: Scan-Link (แอปสแกนของโรงงาน) */
.wh-scan .ws-row .btn.ws-sl{flex:none;font-weight:600;white-space:nowrap}
@media (max-width:640px){.wh-scan .ws-row .btn.ws-sl{flex:1 1 100%;width:auto}
  /* V7.16.4: ผู้รับเหมา / ช่างใช้มือถือเป็นหลัก — ปุ่มกรอง / รหัสที่ยังไม่ยิง กดง่าย (สูง ≥ 34px) · ช่องเลือกงานตัวอักษร 16px (iPhone ไม่ซูมเอง) */
  .pk-fs .fchip{min-height:34px;padding:5px 12px;font-size:13px}
  .pk-chip{min-height:34px;padding:5px 10px;font-size:12.5px}
  .pk-find .pk-pick .select{font-size:16px}
  /* หัวหน้าช่าง / คลังบนมือถือ: ปุ่มเมนูมุมซ้ายบน + เลข Order ในรายการ กดง่ายขึ้น */
  .mtop [data-act=navToggle]{min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center}
  .t.resp td.main > a[data-act=order]{display:inline-block;padding:6px 0}}
.sl-codes{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;max-height:180px;overflow:auto}
.sl-codes .mono{font-size:12.5px;padding:2px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.sl-sum{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:15px}.sl-sum .ok b{color:var(--green)}.sl-sum .bad b{color:var(--red)}
.sl-bad{margin:10px 0 0;padding-left:18px;font-size:13px;line-height:1.55;max-height:200px;overflow:auto}
.pk-done.short{color:var(--amber)}
.wh-miss{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:6px}
.wh-miss .mono{font-size:12px;padding:1px 7px;border:1px dashed #D9B46A;border-radius:6px;background:#fff}
.pk-done-n{font-size:44px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
/* V7.16.4: รอรับเงิน — งวดที่ยังไม่ถึง บอกสถานะ */
.pw + .pw{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.pw-h{font-size:12px;color:var(--text-3);margin-bottom:3px}
.pw-s{font-size:12.5px;color:var(--text-2);margin-top:4px;line-height:1.5}

/* V7.16.6: สแกนดูแบบ / 3D (ฝัง Scan-Link) */
.slv-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 14px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-lg);background:#fff}
.box .slv-bar{margin:0}
.slv-t{display:flex;gap:10px;align-items:center;min-width:0}.slv-t>svg{flex:none;color:var(--action);width:26px;height:26px}
.slv-t b{display:block;font-size:14px}.slv-t span{display:block;font-size:12.5px;color:var(--text-3);line-height:1.4}
.slv-bar .btn{flex:none;min-height:42px}
@media (max-width:640px){.slv-bar .btn{flex:1 1 100%;justify-content:center}}
.slv-ov{position:fixed;inset:0;z-index:250;display:flex;flex-direction:column;background:#0E1A2B}
.slv-h{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--ink);color:#fff}
.slv-h b{display:inline-flex;align-items:center;gap:6px;font-size:15px}
.slv-h .btn{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.22);min-height:38px;text-decoration:none}
.slv-ov iframe{flex:1;width:100%;border:0;background:#fff}
body.slv-on{overflow:hidden}
.slv-pg-h{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.slv-pg-h>svg{flex:none;width:26px;height:26px;color:var(--action)}
.slv-pg-t{flex:1;min-width:0}.slv-pg-t b{display:block;font-size:17px}.slv-pg-t span{display:block;font-size:12.5px;color:var(--text-3);line-height:1.4}
.slv-pg-h .btn{flex:none;text-decoration:none}
.slv-slot{min-height:360px;border-radius:var(--r-lg);background:#EEF2F7}
.slv-dock{position:fixed;z-index:15;border:0;border-radius:var(--r-lg);background:#fff;box-shadow:var(--shadow)}
@media (max-width:640px){.slv-dock,.slv-slot{border-radius:12px}}
/* V7.16.6: หน้าโหลดตอนเปิดแอป — โลโก้ StarNexus Install */
.boot-logo{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#000;color:#B9C3D1}
.boot-logo img{width:min(80vw,400px);height:auto}
.boot-logo .bl-t{display:flex;align-items:center;gap:10px;font-size:14px}
.boot-logo .spin{width:16px;height:16px;border:2px solid rgba(233,199,123,.25);border-top-color:#E9A94B;border-radius:50%;animation:drspin .8s linear infinite;flex:none}
/* V7.16.6: นำเข้า Order คืนจากไฟล์สำรอง */
.imp-list{max-height:min(52vh,460px);overflow:auto;border:1px solid var(--line);border-radius:10px}
.imp-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px}
.imp-row:last-child{border-bottom:0}.imp-row .mono{flex:none}.imp-row .imp-t{flex:1;min-width:0}
.imp-row.bad{background:#FFF6F6;cursor:not-allowed}

/* V7.16.9: รายการห่อจากไลน์ผลิต */
.pp-card .card-b{padding:12px 16px}.pp-card.on{border-color:#BFD9C7;background:#F6FBF7}
.pp-miss{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.pp-miss li{background:#FFF8EC;border:1px solid #F1D9A8;border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.45}
.pp-miss li .mono{font-size:12px;word-break:break-all}
.pp-chk{margin-bottom:10px}.pp-chk.danger .notice{border-width:2px}
.pp-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:6px 0}
.pp-sum div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center}
.pp-sum b{display:block;font-size:20px;line-height:1.2}.pp-sum span{font-size:12px;color:var(--text-3)}
.pp-list{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.pp-row{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px;align-items:start}
.pp-row:last-child{border-bottom:0}.pp-row.multi{background:#FFFBEA}
.pp-row .pp-k{color:var(--text-3);font-variant-numeric:tabular-nums}.pp-row .pp-n{white-space:nowrap;color:var(--text-2)}
.pp-codes{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px}.pp-codes .mono{font-size:11.5px;word-break:break-all}.pp-codes i{font-style:normal;color:#9A6A00;font-weight:700}
.pk-i{color:var(--text-3);margin-left:6px}
@media (max-width:760px){.pp-row{grid-template-columns:48px minmax(0,1fr)}.pp-row .pp-n{grid-column:2}}
.box > .pk-short{margin-top:10px}.box > .pp-miss{margin-top:10px}
/* V7.16.11: เลยกำหนดเสร็จงานติดตั้ง — แถบในปฏิทิน Booking / คิวผู้รับเหมา มีกรอบแดง (ป้าย “เลยกำหนดเสร็จ N วัน” ในรายการ) */
.cb.late{box-shadow:inset 0 0 0 2px var(--red)}
.gb.late{box-shadow:0 0 0 2px var(--red)}
.late-tag{white-space:nowrap}
/* V7.16.12: ปุ่มแบบลิงก์ในข้อความช่วยเหลือ (ใช้ค่ามาตรฐาน) */
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--action);text-decoration:underline;cursor:pointer}
.linkbtn:focus-visible{outline:2px solid currentColor;outline-offset:2px;border-radius:2px}
/* V7.16.12: Order ทั้งหมดใน Production — กล่องเลื่อนดูได้ */
.snb-all{max-height:min(420px,55vh);overflow-y:auto;overscroll-behavior:contain;padding-right:2px}
.snb-all .snb-more{margin:6px 0 2px;width:100%;justify-content:center}

/* ===== V7.17 ไลน์ผลิต (เอกสาร + สถานะ) ===== */
.r-production{background:#7A3E12}
.prd-tbl tr.prd-row{cursor:pointer}
.prd-tbl tr.prd-row:hover td{background:var(--surface-2)}
.prd-tbl tr.prd-row.prd-todo td:first-child{box-shadow:inset 3px 0 0 var(--amber)}   /* V7.17.1: ชื่อคลาสไม่ชน .todo ของหน้าแรก (แถวเคยกลายเป็น flex) */
.prd-tbl tr.prd-row:focus-visible{outline:2px solid var(--action);outline-offset:-2px}
.prd-mo{display:flex;align-items:center;gap:8px;min-width:150px}.prd-mo .prog{flex:1;min-width:60px}
.prd-pills{margin-top:4px;display:flex;gap:4px;flex-wrap:wrap}
.prd-sync{margin-top:10px;display:flex;gap:6px;align-items:center}
.prd-head .prd-hrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.prd-head .prd-hb{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}.prd-head .prd-hb .prd-mob{width:100%}
.prd-tabs{margin:14px 0 12px}
.prd-seg{display:flex;width:100%;max-width:520px}
.prd-seg button{flex:1;padding:10px 8px;font-size:14.5px;font-weight:600}
.prd-seg button .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--gray-bg);color:var(--text-2);font-size:12px;margin-left:4px}
.prd-seg button.on .n{background:rgba(255,255,255,.22);color:#fff}
.prd-doc{margin-bottom:14px}
.prd-doc.off{opacity:.62}
.prd-doc.ok{border-left:4px solid var(--green)}
.prd-doc .card-h h2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prd-trk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:2px 0 14px;position:relative}
.prd-trk .pt{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;position:relative;padding:0 4px}
.prd-trk .pt::before{content:'';position:absolute;top:13px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.prd-trk .pt:first-child::before{display:none}
.prd-trk .pt.done::before{background:var(--green)}
.prd-trk .pt i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line-2);background:#fff;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;color:#fff}
.prd-trk .pt.done i{background:var(--green);border-color:var(--green)}
.prd-trk .pt.cur i{border-color:var(--amber);box-shadow:0 0 0 4px rgba(154,98,6,.14)}
.prd-trk .pt b{font-size:13.5px;margin-top:4px}
.prd-trk .pt span{font-size:11.5px;color:var(--text-3);line-height:1.35}
.prd-trk .pt.cur b{color:var(--amber)}
.prd-wh{margin-bottom:10px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.prd-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.prd-acts .btn:not(.sm){min-height:44px;padding:0 20px;font-size:15px}
.prd-dead{margin:6px 0 14px}.prd-dead summary{cursor:pointer;color:var(--text-2);font-size:13.5px;padding:6px 0}
.prd-lmh{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-bottom:10px}
.prd-due{display:flex;flex-direction:column;padding:10px 14px;border:2px solid var(--ink);border-radius:10px;min-width:180px}
.prd-due span{font-size:12px;color:var(--text-2)}.prd-due b{font-size:22px;color:var(--ink);line-height:1.2}.prd-due span.xs{font-size:11.5px;color:var(--text-3)}
.prd-dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:13.5px}.prd-dl dt{color:var(--text-3)}.prd-dl dd{margin:0}
.prd-bom{margin-top:4px;font-size:12.5px}.prd-bom summary{cursor:pointer;color:var(--action)}.prd-bom ul{margin:4px 0 0;padding-left:18px;color:var(--text-2)}
.prd-lines tr.prd-tot td{border-top:2px solid var(--line-2);font-weight:600}.prd-lines tr.prd-tot .prd-tot-m{display:none}
.prd-mob{min-width:0}
.prd-moh{margin:0 0 10px;display:flex;gap:6px;align-items:flex-start}.prd-moh .ico{flex:none;margin-top:2px}
.prd-bar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;margin-bottom:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.prd-bar.on{border-color:var(--action);box-shadow:0 2px 10px rgba(20,35,59,.10)}
.prd-sec{margin-bottom:14px}.prd-sec .card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.prd-all{display:flex;gap:6px;align-items:center;cursor:pointer}
.prd-mo-t td.ck{width:30px}.prd-mo-t td.ck input,.prd-all input{width:20px;height:20px}
.prd-mo-t tr.sel td{background:var(--blue-bg)}
.prd-mo-t tr.st-received td.main{color:var(--green)}
/* V7.17.1 ไลน์ผลิต 3 แท็บ */
.prd-lt{max-width:760px}
.prd-lt button{display:flex;align-items:center;justify-content:center;gap:6px}
.prd-trk4{grid-template-columns:repeat(4,minmax(0,1fr))}
.prd-sw{display:inline-block;width:11px;height:11px;border-radius:3px;background:hsl(var(--h) 55% 52%);border:1px solid rgba(0,0,0,.18);flex:none}
.prd-cc{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;background:var(--surface);white-space:nowrap}
.prd-paint{border-top:3px solid var(--teal,#0f766e)}
.prd-paint .prd-big{font-size:22px;color:var(--teal,#0f766e)}
.prd-mosum{margin-bottom:12px}.prd-mosum .card-b{display:flex;flex-direction:column;gap:6px}
.prd-cut-t td{vertical-align:middle}
.prd-flt{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 4px}.prd-flt .chips{margin:0}
.prd-sort{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}.fchip.sm{padding:3px 10px;font-size:12.5px}
.prd-lt.prd-lt4{max-width:860px}.prd-dt4,.prd-dt3{max-width:760px}

.si-q{font-size:15px;font-weight:700;white-space:nowrap;text-align:right;padding-top:1px}
.btn.spn-x{width:44px;height:44px;padding:0;margin:8px 10px 0 0;flex:none;color:var(--red);border-color:#E4B4AF}
.spn-drop .card-b{display:flex;flex-direction:column;gap:6px;border-left:0}.spn-drop b{color:var(--red)}
.spn-dr{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap}
.spn-act{position:sticky;bottom:0;z-index:15;background:#fff;border:1px solid var(--line);border-radius:14px 14px 0 0;padding:10px 12px 12px;margin:14px -4px 0;box-shadow:0 -8px 22px rgba(20,35,59,.10);display:flex;flex-direction:column;gap:8px}
.spn-act-h{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--text-2);flex-wrap:wrap}.spn-act-h b{color:var(--ink-text)}
.spn-tgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.spn-tg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:78px;border-radius:12px;border:2px solid #9AA6B4;background:#fff;color:var(--ink-text);cursor:pointer;padding:6px 4px;font:inherit}
.spn-tg b{font-size:15.5px;line-height:1.2}.spn-tg .sub{font-size:12px;color:var(--text-2)}
.spn-tg .bx{width:26px;height:26px;border-radius:7px;border:2px solid #9AA6B4;display:flex;align-items:center;justify-content:center;color:transparent;background:#fff}
.spn-tg.on{color:#fff}.spn-tg.on .sub{color:#fff;opacity:.92}.spn-tg.on .bx{border-color:#fff}
.spn-tg.s1.on{background:#1E5BA8;border-color:#1E5BA8}.spn-tg.s1.on .bx{color:#1E5BA8}
.spn-tg.s2.on{background:#6A4BC4;border-color:#6A4BC4}.spn-tg.s2.on .bx{color:#6A4BC4}
.spn-tg.s3.on{background:#237A4B;border-color:#237A4B}.spn-tg.s3.on .bx{color:#237A4B}
.spn-tg:disabled{opacity:.5;cursor:not-allowed}
.spn-tg:focus-visible{outline:3px solid #6FA3E8;outline-offset:2px}
.spn-msg{font-size:13.5px;line-height:1.45;border-radius:10px;padding:7px 10px}
.spn-msg.ok{background:#E8F0FB;color:#174B8C}.spn-msg.undo{background:#FDF1DA;color:#7A4304}.spn-msg.rm{background:#FBE7E5;color:#8C2019}
.spn-jp{display:flex;flex-direction:column;gap:8px}
.btn.spn-jgo{align-self:flex-start;min-height:44px;padding:0 18px;font-size:15px}
.spn-rmi{background:#F6F8FA;border-radius:10px;padding:10px 12px}
.shell.spn .side .brand .spn-logo{margin:0;font-size:11.5px;color:#14233B}
@media (max-width:700px){
  .spn-tabs button{flex-direction:column;gap:2px;min-height:58px;font-size:13px;padding:6px 2px}
  .spn-tabs button .tl{white-space:nowrap}
  .spn-due{width:74px}.spn-due b{font-size:22px}
  a.spn-row{padding:10px;gap:10px}.sr-go{display:none}
  .spn-wd{flex-direction:column}.spn-wd .spn-due{width:100%;flex-direction:row;gap:10px;justify-content:space-between;padding:10px 14px}
  .spn-act{margin:14px -14px 0;border-radius:14px 14px 0 0;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .content .spn-act{bottom:0}
  .spn-go{flex-direction:column}
}
/* V7.18.1 · SPN V1.1 — แจ้งเตือนรายงาน (ติดตามงาน) */
.btn.fol-b{gap:5px}.btn.fol-b.on{background:#FFF6E3;border-color:#E8B04B;color:#8A4B04}.btn.fol-b.on svg{fill:currentColor}
.fol-mk{display:inline-flex;color:#B7791F;margin:0 2px}.fol-mk svg{fill:currentColor}.fol-mk.off{display:none}
.fol-mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 4px}
.fol-opt{display:flex;flex-direction:column;gap:3px;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font:inherit;color:var(--ink)}
.fol-opt b{font-size:13.5px}.fol-opt span{font-size:11.5px;color:var(--gray);line-height:1.4}
.fol-opt.on{border-color:var(--navy,#14233B);background:#F2F6FC;box-shadow:inset 0 0 0 1px var(--navy,#14233B)}
.fol-lh{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 10px;margin:10px 0 4px}.fol-lh b{font-size:13px}
.fol-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:6px}
.fol-r{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}.fol-r:last-child{border-bottom:0}
.fol-go{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;color:inherit;text-decoration:none}.fol-go .xs{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.fol-go:hover b{text-decoration:underline}
.spn-wa{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:620px){.fol-mode{grid-template-columns:1fr}}
/* V7.18.2 · SPN V1.2 — คำอธิบายเวลาชี้ / แตะ ⓘ */
.tip-i{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin:0 0 0 6px;padding:0;border:1px solid #C9D3E0;border-radius:50%;background:#fff;color:#3B5B85;cursor:pointer;vertical-align:middle;flex:none;line-height:1;position:relative}
.tip-i::after{content:'';position:absolute;inset:-10px}   /* แตะง่ายบนมือถือ (พื้นที่แตะ ≥ 42px) */
.tip-i:hover,.tip-i:focus-visible{background:#EAF1FB;border-color:#3B5B85}
.tip-i svg{width:13px;height:13px}
h1 .tip-i{width:24px;height:24px;margin-left:8px;transform:translateY(-2px)}
.tip-bub{position:fixed;z-index:10050;left:0;top:0;max-width:320px;padding:10px 13px;border-radius:10px;background:#14233B;color:#F4F7FB;font-size:13.5px;line-height:1.55;font-weight:400;box-shadow:0 0 0 1px rgba(255,255,255,.22),0 10px 28px rgba(15,23,42,.28);opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:none;text-align:left;white-space:normal;letter-spacing:0}
.tip-bub.on{opacity:1;visibility:visible}.tip-bub.pin{pointer-events:auto}
.tip-bub b{color:#FFD58A;font-weight:700}
.tip-bub .tb-a{position:absolute;top:-6px;width:12px;height:12px;margin-left:-6px;background:#14233B;transform:rotate(45deg)}
.tip-bub.up .tb-a{top:auto;bottom:-6px}
@media (prefers-reduced-motion:reduce){.tip-bub{transition:none}}
.spn-gdc{margin-bottom:12px;border:1.5px solid #E8B04B;background:#FFFBF0}
.spn-gd{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.spn-gd li{display:flex;gap:12px;align-items:flex-start}
.spn-gd .n{flex:none;width:32px;height:32px;border-radius:50%;background:#14233B;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.spn-gd li div{display:flex;flex-direction:column;gap:2px}.spn-gd li b{font-size:15px}.spn-gd li span{font-size:13.5px;color:var(--text-2);line-height:1.5}
@media (min-width:900px){.spn-gd{grid-template-columns:repeat(3,1fr)}}
/* V1.4: เลขที่เอกสารของแผนก (RM / SP-…) */
.prd-dno{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:6px;border:1px solid var(--line,#cbd5e1);font-size:12px;font-weight:700;vertical-align:1px}

.spn-lg-h{flex-direction:column;align-items:center;text-align:center;gap:4px}
.login.spn-login .spn-lg-h .spn-logo.big{margin:0 auto}
.spn-vh{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;white-space:nowrap!important;margin:0!important;padding:0!important}

/* ===== SPN V1.8.0: ป้าย ⏸ รอ · แท็บแผนก · บัญชีผู้ใช้ ===== */
.prd-hold{display:inline-flex;align-items:center;gap:3px;padding:1px 8px;border-radius:999px;background:var(--amber-bg);color:var(--amber);font-size:12px;font-weight:600;white-space:nowrap;margin-left:4px;vertical-align:middle}
.prd-hold .ico{width:12px;height:12px}
.prd-holdn{display:block;color:var(--amber);margin-top:2px}
.prd-holdb{display:flex;gap:8px;align-items:flex-start;background:var(--amber-bg);color:#7a4d05;border:1px solid #F1D7A6;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13.5px;line-height:1.5}
.prd-holdb .ico{flex:none;margin-top:3px}
.sr-hold{display:flex;align-items:center;gap:4px;color:var(--amber);font-size:12.5px;font-weight:600}
.spn-bar .b-hold,.spn-lg .b-hold{background:repeating-linear-gradient(135deg,#E0A33A 0 4px,#F2C77C 4px 8px)}.spn-bar .b-hold{margin-left:auto}
.spn-hrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.spn-hrow:empty{display:none}
.spn-hbtn{flex:1;min-height:44px;justify-content:center;border-color:#E9C98C;color:#7a4d05;background:#FFF8EA}.spn-hbtn.go{border-color:#A9D8BD;color:var(--green);background:var(--green-bg)}
.prd-hr{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.prd-hc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.prd-hc:has(input:checked){background:var(--amber-bg);border-color:#E0A33A;color:#7a4d05;font-weight:600}
.pp.pp-hold{box-shadow:inset 0 0 0 2px #E0A33A}.prd-now.pn-hold{background:var(--amber-bg);color:var(--amber)}
.fchip-hold.on{background:var(--amber-bg)!important;border-color:#E0A33A!important;color:#7a4d05!important}
.prd-seg.prd-dtn{flex-wrap:wrap;max-width:none}.prd-seg.prd-dtn button{flex:1 1 30%}
.prd-hcap{margin-bottom:6px}
.pu-st{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 12px}.pu-role .check{margin:2px 0;font-weight:400}.pu-role .check b{font-weight:700}.pu-sum{margin:8px 0 0;padding:8px 10px;border-radius:8px;background:var(--surface-2,#F7F9FB);border:1px solid var(--line,#DFE4EA);font-size:13px;line-height:1.7}.pu-ok{color:#15803D;font-weight:700}.pu-no{color:#B91C1C;font-weight:700}.pu-warn{color:#B45309}.pu-gw{margin-top:10px}.pu-gt{font-size:12px;font-weight:600;color:var(--text-2,#334155);margin:0 0 4px}.pu-gd{width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.45}.pu-gd th{text-align:left;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line-2,#C9D1DB);white-space:nowrap}.pu-gd td{padding:6px 8px;border-bottom:1px solid var(--line,#DFE4EA);vertical-align:top}.pu-gd .c{text-align:center}.pu-gd tr.on td{background:#EFF6FF}.pu-gd tr.on td:first-child{box-shadow:inset 3px 0 0 #2563EB;font-weight:600}.pu-me{display:none;margin-left:6px;font-size:11px;font-weight:700;color:#2563EB;white-space:nowrap}.pu-gd tr.on .pu-me{display:inline}.pu-y,.pu-n{font-size:16px;line-height:1}.pu-y{color:#15803D}.pu-n{color:#94A3B8}@media (max-width:560px){.pu-gd{font-size:11.5px}.pu-gd th{white-space:normal}.pu-gd th,.pu-gd td{padding:5px 4px}.pu-gd td:nth-child(2){white-space:nowrap}}
/* ===== SPN V1.8.1: รายการเบิก + วัตถุดิบที่ใช้ (ดูอย่างเดียว · Production V302) ===== */
.prd-wd{border-bottom:1px solid var(--line);background:var(--surface-2)}
.prd-wd-h,.prd-wd-h2{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:10px 18px 6px}
.prd-wd-h b,.prd-wd-h2 b{font-size:14.5px;display:inline-flex;align-items:center;gap:6px}
.prd-wd-h2{padding-top:12px}
.prd-wd .t{background:transparent}
.prd-wdt{display:inline-block;margin-left:4px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;vertical-align:1px;white-space:nowrap}
.prd-wdt.bar{background:var(--blue-bg);color:var(--blue)}.prd-wdt.raw{background:var(--green-bg);color:var(--green)}
.prd-mat{display:block;margin-top:3px;font-size:12.5px;color:var(--text-2);line-height:1.5}
.prd-mat b{color:var(--text,inherit);font-weight:700}
.prd-plan{margin-top:3px}.prd-plan summary{cursor:pointer;color:var(--blue);font-size:12.5px}.prd-plan div{font-size:12px;color:var(--text-2);line-height:1.45}
.prd-wdc{padding:0;overflow:hidden}.prd-wdc>summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;cursor:pointer;list-style:none;font-size:14.5px}
.prd-wdc>summary::-webkit-details-marker{display:none}.prd-wdc>summary .chev{margin-left:auto;transition:transform .15s}.prd-wdc[open]>summary .chev{transform:rotate(90deg)}
.prd-wdc[open]>summary{border-bottom:1px solid var(--line)}.prd-wdc .prd-wd{border-bottom:0}.prd-wdc .prd-wd-h{display:none}
@media (max-width:760px){.prd-wd .t.resp td .sub,.prd-mo-t td .prd-mat{text-align:left}.prd-wd-h,.prd-wd-h2{padding-left:12px;padding-right:12px}}
/* ===== SPN V1.8.2: สีตามสถานะ — ผู้ใช้ 18/11 18:56 “ให้คนทำงานเห็นแล้วเข้าใจเลย · แต่ละสเตตัสเปลี่ยนเป็นสีเลย · ตอนนี้ดูจืดไป” =====
   ยังไม่รับงาน = เทาเข้ม · รับงานแล้ว = น้ำเงิน · กำลังทำ = ม่วง · เสร็จแล้ว = เขียว · ⏸ รอ = เหลืองส้ม · เลยกำหนด = แดง (สีเดียวกับปุ่มติ๊ก) */
:root{--s-sent:#56657A;--s-sent-bg:#EDF1F5;--s-got:#1E5BA8;--s-got-bg:#E3EDFA;--s-doing:#6A4BC4;--s-doing-bg:#EEE8FB;--s-done:#1F8A4C;--s-done-bg:#E0F3E7;--s-hold:#F2B01E;--s-hold-ink:#4A2D00;--s-hold-bg:#FFF3D6}
.badge.spn-st{color:#fff;font-weight:700;gap:4px;padding:0 10px 0 8px;letter-spacing:.1px}

:root{--action:#2563EB;--action-2:#1D4ED8;--action-bg:#DBEAFE;--blue:#2563EB;--blue-bg:#DBEAFE;--green:#16A34A;--s-sent:#64748B;--s-got:#2563EB;--s-doing:#7C3AED;--s-done:#16A34A;--s-sent-bg:#F1F5F9;--s-got-bg:#DBEAFE;--s-doing-bg:#EDE9FE;--s-done-bg:#DCFCE7}

.seg button.on{background:#DBEAFE;color:#1E3A8A;box-shadow:inset 0 0 0 2px #3B82F6;font-weight:700}

.toast{background:#FFFFFF;color:#0F172A;box-shadow:0 10px 30px rgba(15,23,42,.18),inset 4px 0 0 #3B82F6}

.toast.err{background:#FEE2E2;color:#7F1D1D;font-weight:600;box-shadow:0 10px 30px rgba(127,29,29,.22),inset 4px 0 0 #DC2626,inset 0 0 0 1px #FCA5A5}
.toast.err .ico{color:#DC2626}
/* PSN V1.9.4: หัวงาน เลขที่เอกสาร / LOT / Item ID ตัวหนาสีดำ */
.sr-h b.prd-idl,.spn-wt b.prd-idl,b.prd-idl{color:#000;font-weight:700;overflow-wrap:anywhere;word-break:break-word}
.prd-idl .prd-ids{font-weight:500;color:#000}
/* V1.9.5: 1 ช่อง (คำนำหน้า + ค่า) = 1 ก้อน — ไม่ตัดกลางค่า เช่น “RE- / 0069-…” · ยาวกว่าจอจริง ๆ ถึงตัดในก้อน */
.sr-h b.prd-idl,.spn-wt b.prd-idl,b.prd-idl{overflow-wrap:normal;word-break:normal}
.prd-idl .prd-idp{display:inline-block;max-width:100%;overflow-wrap:anywhere;vertical-align:baseline}
/* V1.9.5: การ์ดงาน = grid · คอม: วันที่ | หัวงาน / รายละเอียด | > (เหมือนเดิม) · มือถือ (≤ 700 px): หัวงานเต็มความกว้างบนสุด แล้วค่อย วันที่ | รายละเอียด */
a.spn-row.prd-qc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:'due head go' 'due body go';row-gap:4px;align-items:start}
a.spn-row.prd-qc>.spn-due{grid-area:due;align-self:stretch}
a.spn-row.prd-qc>.sr-h{grid-area:head;min-width:0}
a.spn-row.prd-qc>.sr-b{grid-area:body;min-width:0}
a.spn-row.prd-qc>.sr-go{grid-area:go;align-self:center}
@media (max-width:700px){a.spn-row.prd-qc{grid-template-columns:auto minmax(0,1fr);grid-template-areas:'head head' 'due body';row-gap:8px}a.spn-row.prd-qc>.spn-due{align-self:start}}

.prd-snc:hover,.prd-snc:focus-visible{background:#1D4ED8;outline:none;box-shadow:0 0 0 3px #BFDBFE}
.prd-snc.sh{background:#16A34A;box-shadow:0 2px 6px rgba(22,163,74,.35)}
.prd-snc.sh:hover,.prd-snc.sh:focus-visible{background:#15803D;box-shadow:0 0 0 3px #BBF7D0}
.prd-snc.off{border:1px dashed #CBD5E1;background:#F8FAFC;color:#64748B;font-weight:500;font-size:12.5px;padding:4px 10px;box-shadow:none}

.btn.prd-sn{background:#2563EB;border-color:#2563EB;color:#fff;font-weight:700}.btn.prd-sn:hover{background:#1D4ED8;border-color:#1D4ED8;color:#fff}.btn.prd-sn .ico,.btn.prd-sn svg{color:#fff}
.btn.prd-snsh{white-space:nowrap;background:#16A34A;border-color:#16A34A;color:#fff;font-weight:700}.btn.prd-snsh:hover{background:#15803D;border-color:#15803D;color:#fff}.btn.prd-snsh .ico,.btn.prd-snsh svg{color:#fff}
.sr-st{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.prd-lot1.pl-lotsn{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

on('doLogin', async () => {
  const f = $('#lf'), e = $('#lf-err'), name = f.u.value.trim().toLowerCase(), pw = f.p.value;
  if (Date.now() < LOGIN.until) { e.textContent = 'ใส่รหัสผิดหลายครั้ง — รอ ' + Math.ceil((LOGIN.until - Date.now()) / 1000) + ' วินาที'; return; }
  if (!/^[a-z0-9._-]{3,32}$/.test(name) || !pw) { e.textContent = 'กรอก Username และ Password'; return; }
  e.textContent = '';
  try { await signIn(name, pw); }
  catch (err) { if (err.status && err.status < 500 && err.status !== 429) { LOGIN.fails++; if (LOGIN.fails >= 5) { LOGIN.until = Date.now() + 30000; LOGIN.fails = 0; } } e.textContent = err.message; f.p.value = ''; return; }
  try { await refresh(); }
  catch (err) { await signOut(); DB = null; e.textContent = err.message; return; }
  const u = S.user;
  if (!SPN_ROLES[u.role]) { await signOut(); DB = null; S.user = null; lastState = ''; f.p.value = ''; e.textContent = 'บัญชี ' + ((ROLES[u.role] || {}).label || u.role) + ' ใช้ Contractor Nexus — Starmark PSN สำหรับฝ่ายผลิต / Support / Admin'; return; }
  LOGIN.fails = 0; rpc('cn_touch_login').catch(() => {});
  toast('เข้าสู่ระบบเป็น ' + u.name + ' (' + ROLES[u.role].label + ')');
  go(ROLES[u.role].home);
});

  if (!d || typeof d !== 'object' || !Array.isArray(d.orders) || String(d.app || '').indexOf('Contractor Nexus') < 0) { toast('ไม่ใช่ไฟล์สำรองของ Contractor Nexus — เลือกไฟล์ที่ได้จาก “ดาวน์โหลดสำเนา JSON”', 'err'); return; }
  const have = new Set(DB.orders.map((o) => o.id)), cids = new Set(DB.contractors.map((c) => c.id));
  const ok = (o) => o && typeof o === 'object' && /^SO-\d{4}-\d{1,6}$/.test(String(o.id || ''));

async function pushSync() {
  if (!PUSH.reg || !pushCapable()) { pushCardRefresh(); return; }

    if (n) { await refresh(); if (/^\/prd\//.test(curPath()) && !isEditing() && !$('#overlay.on')) rerender(); }
  } catch (e) { PRDS.last = Object.assign({}, PRDS.last || {}, { err: e.message, errAt: Date.now() }); } finally {

function prdTDragInit() {   /* ลากแท็บ: pointer (เมาส์ / นิ้ว) · กดค้าง 180 ms บนมือถือก่อนเริ่มลาก (เลื่อนจอได้ตามปกติ) */
  const bar = $('.spn-tabs.spn-ro'); if (!bar || bar.__drag) return; bar.__drag = 1;
  let D = null;
  const items = () => Array.from(bar.querySelectorAll('.spn-rt'));
  const end = (commit) => {
    if (!D) return; const d = D; D = null; clearTimeout(d.t);
    d.el.classList.remove('drag'); d.el.style.transform = ''; bar.classList.remove('dragging');
    if (commit && d.on) {
      const L = PRD.tord || [], from = L.indexOf(d.k); let to = d.to;
      if (from >= 0 && to != null && to !== from) { L.splice(from, 1); L.splice(to > from ? to - 1 : to, 0, d.k); rerender(); }
    }
  };
  bar.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.spn-rt'); if (!el || e.target.closest('button')) return;
    D = { el, k: el.dataset.k, x: e.clientX, y: e.clientY, on: false, to: null, id: e.pointerId };
    const go = () => { if (!D) return; D.on = true; el.classList.add('drag'); bar.classList.add('dragging'); try { el.setPointerCapture(D.id); } catch (x) { /* ไม่รองรับ */ } };
    if (e.pointerType === 'mouse') go(); else D.t = setTimeout(go, 180);
  });
  bar.addEventListener('pointermove', (e) => {
    if (!D) return;
    if (!D.on) { if (Math.abs(e.clientX - D.x) + Math.abs(e.clientY - D.y) > 10) { clearTimeout(D.t); D = null; } return; }
    e.preventDefault();
    D.el.style.transform = 'translate(' + (e.clientX - D.x) + 'px,' + (e.clientY - D.y) + 'px)';
    let best = null; items().forEach((it, i) => { if (it === D.el) return; const r = it.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, dd = Math.hypot(e.clientX - cx, e.clientY - cy);
      if (!best || dd < best.d) best = { d: dd, i: e.clientX > cx && Math.abs(e.clientY - cy) < r.height ? i + 1 : i, el: it }; });
    items().forEach((it) => it.classList.remove('drop-l', 'drop-r'));

  });
  bar.addEventListener('pointerup', () => { items().forEach((it) => it.classList.remove('drop-l', 'drop-r')); end(true); });
  bar.addEventListener('pointercancel', () => { items().forEach((it) => it.classList.remove('drop-l', 'drop-r')); end(false); });
}

    '<a class="btn ' + (prdCan(k) ? 'primary' : '') + ' spn-jgo" href="' + prdWHref(k, ref) + '">' + icon(prdCan(k) ? 'check' : 'eye', 'sm') + ' ' + (prdCan(k) ? 'ติ๊กสถานะ' : 'ดูรายการ') + ' ' + icon('chevRight', 'xs') + '</a></div>';
}
function prdStageCard(k, oid, x, extra, H) {   /* V1.8.0: H = ป้ายรอ */
  const st = x.st || 'sent';
  return '<div class="card prd-doc prd-stage st-' + st + (st === 'done' ? ' ok' : '') + '"><div class="card-h"><h2>' + icon(PRD_STG[k].ico) + ' สถานะ' + PRD_STG[k].t + ' ' + prdBadge(k, st) + (extra || '') + '</h2>' +
